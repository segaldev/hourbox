<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hourbox">
<meta name="theme-color" content="#EEECE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151513" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hourbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/themes/washi.css">
<link rel="stylesheet" href="css/themes/sage.css">
<link rel="stylesheet" href="css/themes/deep.css">
<link rel="stylesheet" href="css/themes/mist.css">
<link rel="stylesheet" href="css/themes/stone.css">
<link rel="stylesheet" href="css/themes/forest.css">
<link rel="stylesheet" href="css/themes/wood.css">
<link rel="stylesheet" href="css/themes/dune.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/boot.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Hourbox</div>
    <nav class="seg" aria-label="View">
      <button id="v-day" data-act="view" data-v="day" aria-pressed="true">Day</button>
      <button id="v-month" data-act="view" data-v="month" aria-pressed="false">Month</button>
    </nav>
    <div class="datenav">
      <button class="iconbtn" id="nav-prev" data-act="nav" data-d="-1" aria-label="Previous">‹</button>
      <div class="datepick"><label id="datelabel" for="datejump">Today</label><input type="date" id="datejump" aria-label="Jump to date"></div>
      <button class="iconbtn" id="nav-next" data-act="nav" data-d="1" aria-label="Next">›</button>
      <button class="btn ghost" id="nav-today" data-act="today">Today</button>
    </div>
    <span class="sync" id="sync" data-s="saving">Connecting…</span>
    <button class="iconbtn" id="zen" data-act="zen" aria-label="Zen mode: just the current box" title="Zen mode: just the current box"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.8 6.4A8 8 0 1 0 20 12.2"/></svg></button>
    <button class="iconbtn" id="journal-view" data-act="journal-view" aria-label="Journal entries" title="Journal entries"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 6 3.5z"/><path d="M8 3.5v17M11 8h5M11 11.5h5M11 15h3"/></svg></button>
    <button class="iconbtn" id="look" data-act="look" aria-label="Look: theme and style" title="Look: theme and style"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5c-5 0-8.6 3.6-8.6 8.2 0 4.3 3.5 8 7.8 8 1.3 0 2-.7 2-1.6 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-.9.8-1.6 1.7-1.6h2.1c2.6 0 4.6-2 4.6-4.6 0-3.2-3.8-5.8-8.6-5.8z"/><circle cx="7.7" cy="11.4" r="1.15" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.7" r="1.15" fill="currentColor" stroke="none"/><circle cx="14.7" cy="7.7" r="1.15" fill="currentColor" stroke="none"/><circle cx="17.3" cy="10.9" r="1.15" fill="currentColor" stroke="none"/></svg></button>
    <button class="iconbtn" id="settings" data-act="settings" aria-label="Settings" title="Settings: daily routine and account"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div id="banner"></div>
  <main id="app"><div class="loading">Loading your planner…</div></main>
</div>
<div class="placebar" id="placebar" hidden><span id="placetext"></span><button data-act="cancel-place" id="place-cancel">Cancel</button></div>
<div class="toast" id="toast" hidden></div>
<div id="modal-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
