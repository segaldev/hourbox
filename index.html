<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hourbox">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Hourbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: planner sheet — thinking space column on the left, a ruled 1-hour grid on the right; stacks on phones */
:root {
  --paper: #F3F5F8; --surface: #FFFFFF; --sunk: #EBEEF3; --ink: #17202D; --muted: #5E6A7B; --line: #D9DEE6;
  --accent: #2C57E0; --accent-ink: #FFFFFF; --accent-soft: #E3E9FC; --now: #E39B10;
  --done: #23905F; --partial: #C27E0E; --skipped: #A9475A;
  --t-deep: #4B57D6; --t-meet: #13877F; --t-admin: #B7791F; --t-personal: #C0457A;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 4px 16px rgba(20,30,50,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E131A; --surface: #161D27; --sunk: #1C2430; --ink: #E5E9EF; --muted: #93A0B2; --line: #2A3442;
  --accent: #7D99FF; --accent-ink: #0E131A; --accent-soft: #222E4D; --now: #F1B23A;
  --done: #4CC08A; --partial: #E5A43C; --skipped: #E07A8C;
  --t-deep: #8C95FF; --t-meet: #45C2B8; --t-admin: #E0A84E; --t-personal: #EE7FAE;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E131A; --surface: #161D27; --sunk: #1C2430; --ink: #E5E9EF; --muted: #93A0B2; --line: #2A3442;
  --accent: #7D99FF; --accent-ink: #0E131A; --accent-soft: #222E4D; --now: #F1B23A;
  --done: #4CC08A; --partial: #E5A43C; --skipped: #E07A8C;
  --t-deep: #8C95FF; --t-meet: #45C2B8; --t-admin: #E0A84E; --t-personal: #EE7FAE;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 18px; height: 18px; border: 2.5px solid var(--ink); border-radius: 4px; position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 2.5px; background: var(--now); }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: 18px; line-height: 1; }
.datepick { position: relative; }
.datepick label { display: block; font-family: var(--f-display); font-weight: 500; font-size: 17px; padding: 4px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.datepick label:hover { background: var(--sunk); }
.datepick input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.sync { margin-left: auto; white-space: nowrap; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--done); }
.sync[data-s="saving"]::before { background: var(--now); }
.sync[data-s="error"]::before, .sync[data-s="offline"]::before { background: var(--skipped); }
.sync[data-s="local"]::before { background: var(--muted); }

/* Day layout */
.day { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); grid-template-areas: "prio grid" "dump grid" "park grid" ". grid"; gap: 16px 24px; align-items: start; }
.a-prio { grid-area: prio; } .a-dump { grid-area: dump; } .a-park { grid-area: park; } .a-grid { grid-area: grid; }
@media (max-width: 820px) { .day { grid-template-columns: minmax(0, 1fr); grid-template-areas: "prio" "dump" "grid" "park"; } }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; min-width: 0; }
.pane h2, .gridhead h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: -.005em; }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.hint { font-size: 12.5px; color: var(--muted); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Priorities */
.prio-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prio-row { display: grid; grid-template-columns: 22px 20px minmax(0,1fr) auto auto; align-items: center; gap: 6px; padding: 4px 4px 4px 2px; border-radius: 8px; }
.prio-row:hover { background: var(--sunk); }
.prio-n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: center; }
.prio-row input[type=text] { border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 4px 2px; min-width: 0; width: 100%; }
.prio-row input[type=text]:focus { outline: none; border-bottom-color: var(--accent); }
.prio-row.done input[type=text] { text-decoration: line-through; color: var(--muted); }
.check { appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: 5px; margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--surface); }
.check:checked { background: var(--done); border-color: var(--done); }
.check:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.badge { font-size: 11px; font-family: var(--f-mono); padding: 1px 6px; border-radius: 99px; white-space: nowrap; }
.badge.on { background: var(--accent-soft); color: var(--accent); }
.badge.off { color: var(--muted); border: 1px dashed var(--line); }

/* Item lists */
.add { display: flex; gap: 6px; margin-bottom: 8px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 10px; }
.add input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { display: flex; align-items: center; gap: 4px; padding: 5px 4px 5px 8px; border-radius: 8px; min-width: 0; }
.item:hover { background: var(--sunk); }
.item .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item[draggable="true"] { cursor: grab; }
.item.picked, .prio-row.picked { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.mini { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none; font-size: 14px; }
.mini:hover { background: var(--surface); color: var(--ink); }
.mini svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.empty-note { color: var(--muted); font-size: 13px; padding: 6px 8px; }

/* Hour grid */
.a-grid { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.gridhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.gridhead .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gridhead h2 { font-size: 19px; }
.extend { display: flex; gap: 6px; justify-content: center; padding: 6px; background: var(--paper); }
.extend .btn { font-size: 12.5px; padding: 3px 10px; }
.hours { position: relative; }
.hour { display: grid; grid-template-columns: 64px minmax(0,1fr); min-height: 62px; border-top: 1px solid var(--line); }
.hour:first-child { border-top: 0; }
.hlabel { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 8px 10px 0 12px; text-align: right; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
.hour.now .hlabel { color: var(--now); font-weight: 500; }
.cells { display: grid; min-width: 0; }
.cell { position: relative; padding: 6px 8px; min-width: 0; }
.split-2 .cell, .split-4 .cell { padding: 3px 8px; }
.cells .cell + .cell { border-top: 1px dashed var(--line); }
.split-2 .box { min-height: 40px; }
.split-4 .box { min-height: 30px; padding: 2px 10px; gap: 8px; }
.split-4 .stbtn { width: 20px; height: 20px; }
.split-4 .box .btxt { font-size: 14px; }
.smin { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
.box.empty .smin { color: var(--muted); opacity: .75; }
.box.nowslot .smin { color: var(--now); opacity: 1; font-weight: 500; }
.hlabel { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.splitbtn { font-family: var(--f-mono); font-size: 10.5px; line-height: 1; padding: 3px 5px; border-radius: 5px; border: 1px dashed var(--line); background: transparent; color: var(--muted); opacity: 0; transition: opacity .12s; }
.hour:hover .splitbtn, .splitbtn:focus-visible, .splitbtn.on { opacity: 1; }
.splitbtn.on { border-style: solid; border-color: var(--accent); color: var(--accent); }
.splitbtn:hover { color: var(--ink); border-color: var(--muted); }
@media (hover: none) { .splitbtn { opacity: .8; } }
.box { width: 100%; height: 100%; min-height: 50px; border-radius: 9px; border: 1.5px dashed transparent; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; padding: 6px 10px; transition: background .12s, border-color .12s; }
.box.empty { color: transparent; }
.box.empty:hover, .placing .box.empty { border-color: var(--line); color: var(--muted); }
.box.empty .plus { font-size: 13px; }
.box.filled { background: var(--sunk); border: 1.5px solid transparent; cursor: pointer; }
.box.filled:hover { border-color: var(--line); }
.box.drop { border-color: var(--accent) !important; background: var(--accent-soft) !important; color: var(--accent) !important; }
.placing .box { cursor: copy; }
.box .btxt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.box.st-done .btxt { color: var(--muted); }
.box.st-skipped .btxt { text-decoration: line-through; color: var(--muted); }
.stbtn { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; }
.stbtn svg { width: 14px; height: 14px; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.stbtn.done { background: var(--done); border-color: var(--done); } .stbtn.done svg { stroke: var(--surface); }
.stbtn.partial { border-color: var(--partial); background: linear-gradient(90deg, var(--partial) 50%, var(--surface) 50%); }
.stbtn.skipped { border-color: var(--skipped); } .stbtn.skipped svg { stroke: var(--skipped); }
.tag { flex: none; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.tg-deep { --tc: var(--t-deep); } .tg-meet { --tc: var(--t-meet); } .tg-admin { --tc: var(--t-admin); } .tg-personal { --tc: var(--t-personal); }
.prio-flag { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 2; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.readonly .box { cursor: default; }

/* Summary card */
.summary { padding: 16px; border-bottom: 1px solid var(--line); background: var(--paper); display: grid; gap: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.refl { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.refl div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.refl p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Month */
.month { display: grid; gap: 18px; }
.goals ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.goals li { display: flex; align-items: center; gap: 8px; }
.goals input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 5px 2px; }
.goals input:focus { outline: none; border-bottom-color: var(--accent); }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); }
.dcell { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 8px; background: var(--surface); border-top: 0; border-left: 0; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dcell:nth-child(7n) { border-right: 0; }
.dcell:hover { background: var(--sunk); }
.dcell.out { background: var(--paper); color: var(--muted); }
.dcell .dn { display: flex; align-items: center; justify-content: space-between; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.dcell.today .dn span:first-child { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 6px; }
.fin { color: var(--done); font-size: 12px; font-weight: 600; }
.dp { font-size: 12px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.dp.done { color: var(--muted); text-decoration: line-through; }
.dbar { margin-top: auto; display: flex; gap: 2px; height: 5px; }
.dbar i { flex: 1; border-radius: 2px; background: var(--line); }
.dbar i.f { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.dbar i.d { background: var(--done); }
.dcount { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
@media (max-width: 640px) { .dcell { min-height: 64px; padding: 5px; } .dp, .dcount { display: none; } .cal-head div { padding: 6px 4px; text-align: center; } .dbar { height: 4px; } }

/* Placing bar, toast, modal */
.placebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.placebar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placebar button { border: 0; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 5px 10px; font-weight: 500; flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; box-shadow: var(--shadow); font-size: 14px; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,15,25,.45); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.modal header { padding: 16px 18px 10px; }
.modal h3 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.modal .body { padding: 0 18px 8px; display: grid; gap: 18px; }
.modal footer { padding: 12px 18px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); }
.modal footer .left { margin-right: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.field input[type=text], .field textarea { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 8px 10px; width: 100%; resize: vertical; }
.field input[type=text]:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--sunk); font-weight: 600; }
.chip.tag-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--line)); }
.rev { display: grid; gap: 6px; }
.rev-row { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rev-row:last-child { border-bottom: 0; }
.rev-row .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rev-row .x { overflow-wrap: anywhere; }
.rev-row .chips { grid-column: 2; }
.chip.s-done[aria-pressed="true"] { border-color: var(--done); color: var(--done); }
.chip.s-partial[aria-pressed="true"] { border-color: var(--partial); color: var(--partial); }
.chip.s-skipped[aria-pressed="true"] { border-color: var(--skipped); color: var(--skipped); }
.sect-title { font-family: var(--f-display); font-weight: 700; font-size: 15px; margin: 0 0 4px; }
.energy { display: flex; gap: 6px; }
.energy .chip { width: 38px; justify-content: center; font-family: var(--f-mono); }
.setup { max-width: 640px; margin: 0 auto; display: grid; gap: 4px; }
.setup p { margin: 0 0 8px; max-width: 65ch; }
.setup a, .banner a { color: var(--accent); }
.steps { margin: 4px 0 12px; padding-left: 20px; display: grid; gap: 10px; }
.steps ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; color: var(--muted); }
.setup code { font-family: var(--f-mono); font-size: 13px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.setup-form { display: grid; gap: 12px; }
.field input[type=password] { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 8px 10px; width: 100%; font-family: var(--f-mono); }
.field input[type=password]:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.setup-actions { display: flex; flex-wrap: wrap; gap: 8px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.setup .sep { border: 0; border-top: 1px solid var(--line); margin: 14px 0 10px; width: 100%; }
.setup details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.setup details[open] summary { margin-bottom: 8px; }
.hint.err:not(:empty) { color: var(--ink); background: var(--sunk); padding: 6px 10px; border-radius: 8px; }
.hint:empty { display: none; }
.vault-out { margin-top: 12px; padding: 14px; border: 1px solid var(--accent); border-radius: 12px; background: var(--accent-soft); display: grid; gap: 8px; }
.vault-out textarea { width: 100%; font-family: var(--f-mono); font-size: 11.5px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px; resize: vertical; }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.banner { margin-bottom: 14px; padding: 8px 12px; border-radius: 10px; background: var(--sunk); color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Hourbox</div>
    <nav class="seg" aria-label="View">
      <button id="v-day" data-act="view" data-v="day" aria-pressed="true">Day</button>
      <button id="v-month" data-act="view" data-v="month" aria-pressed="false">Month</button>
    </nav>
    <div class="datenav">
      <button class="iconbtn" id="nav-prev" data-act="nav" data-d="-1" aria-label="Previous">‹</button>
      <div class="datepick"><label id="datelabel" for="datejump">Today</label><input type="date" id="datejump" aria-label="Jump to date"></div>
      <button class="iconbtn" id="nav-next" data-act="nav" data-d="1" aria-label="Next">›</button>
      <button class="btn ghost" id="nav-today" data-act="today">Today</button>
    </div>
    <span class="sync" id="sync" data-s="saving">Connecting…</span>
    <button class="iconbtn" id="settings" data-act="settings" aria-label="Account and sync" title="Account and sync"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <div id="banner"></div>
  <main id="app"><div class="loading">Loading your planner…</div></main>
</div>
<div class="placebar" id="placebar" hidden><span id="placetext"></span><button data-act="cancel-place" id="place-cancel">Cancel</button></div>
<div class="toast" id="toast" hidden></div>
<div id="modal-root"></div>

<script>
(() => {
"use strict";
// ---------- utils ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const hourLabel = h => h === 24 ? "Midnight" : new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: "numeric" });
const hourShort = h => new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
// Slots: an hour is one 60-minute box (key "9"), or split into 30s ("9:00", "9:30") or 15s ("9:00" … "9:45").
const splitOf = (d, h) => (d.splits && d.splits[h]) || 1;
const slotKeys = (d, h) => { const n = splitOf(d, h); return n === 1 ? [String(h)] : Array.from({ length: n }, (_, i) => `${h}:${pad(i * 60 / n)}`); };
const hourOfKey = k => parseInt(k, 10);
const minOfKey = k => { const [h, m] = String(k).split(":"); return +h * 60 + (+m || 0); };
const lenOfKey = (d, k) => 60 / splitOf(d, hourOfKey(k));
const timeLabel = min => new Date(2000, 0, 1, Math.floor(min / 60) % 24, min % 60).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const slotRange = (d, k) => `${timeLabel(minOfKey(k))} – ${timeLabel(minOfKey(k) + lenOfKey(d, k))}`;
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`; };
const sortedKeys = d => Object.keys(d.boxes).sort((a, b) => minOfKey(a) - minOfKey(b));
const hourHasBox = (d, h) => Object.keys(d.boxes).some(k => hourOfKey(k) === h);
function nextSlot(d, k) { const h = hourOfKey(k), ks = slotKeys(d, h), i = ks.indexOf(String(k)); if (i >= 0 && i < ks.length - 1) return ks[i + 1]; return h >= 23 ? null : slotKeys(d, h + 1)[0]; }
const TAGS = [["", "None"], ["deep", "Deep work"], ["meet", "Meetings"], ["admin", "Admin"], ["personal", "Personal"]];
const TAGNAME = Object.fromEntries(TAGS);
const ICON = {
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  park: '<svg viewBox="0 0 24 24"><path d="M7 20V4h6a4.5 4.5 0 0 1 0 9H7"/></svg>',
  today: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
};

// ---------- state ----------
const S = { view: "day", date: todayKey(), docs: {}, ready: false, mode: "connecting", placing: null };
const DEF_START = 6, DEF_END = 22;

function blankDay(key) {
  return { kind: "day", date: key, month: key.slice(0, 7), start: DEF_START, end: DEF_END, boxes: {},
    prio: [{ text: "", done: false }, { text: "", done: false }, { text: "", done: false }],
    dump: [], finished: false, reflection: null, summary: null };
}
function normDay(d, key) {
  const b = blankDay(key); const o = Object.assign(b, d || {});
  if (!Array.isArray(o.prio)) o.prio = b.prio;
  while (o.prio.length < 3) o.prio.push({ text: "", done: false });
  o.boxes = o.boxes || {}; o.dump = o.dump || [];
  o.start = Math.min(o.start, DEF_START);
  return o;
}
const dayId = k => "day-" + k;
const getDay = k => normDay(S.docs[dayId(k)], k);
const hasDay = k => !!S.docs[dayId(k)];
const getPark = () => Object.assign({ kind: "parking", items: [] }, S.docs.parking || {});
const getMonth = m => Object.assign({ kind: "month", month: m, goals: ["", "", "", "", ""] }, S.docs["month-" + m] || {});

function mutate(id, base, fn, opts = {}) {
  const d = clone(base); fn(d); S.docs[id] = d; Store.save(id); if (!opts.silent) render();
}
const mutateDay = (k, fn, opts) => mutate(dayId(k), getDay(k), fn, opts);
const mutatePark = (fn, opts) => mutate("parking", getPark(), fn, opts);

// ---------- persistence ----------
const LS_KEY = "hourbox-v1";          // offline cache of your plans on this device
const CFG_KEY = "hourbox-github";     // repo + token for this device (never leaves this browser except to api.github.com)
const DATA_PATH = "hourbox.json";
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const b64enc = s => { const b = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));

const GH = {
  cfg: null,
  async req(path, opts = {}) {
    let r;
    try {
      r = await fetch("https://api.github.com" + path, Object.assign({}, opts, { cache: "no-store", headers: Object.assign({
        Authorization: "Bearer " + this.cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" }, opts.headers || {}) }));
    } catch (e) { throw { kind: "network" }; }
    return r;
  },
  repoPath() { return `/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}`; },
  async checkRepo() {
    const r = await this.req(this.repoPath());
    if (r.status === 401) throw { kind: "auth", msg: "GitHub didn’t accept that token. Check it was copied in full and hasn’t expired." };
    if (r.status === 404 || r.status === 403) throw { kind: "repo", msg: `Can’t open ${this.cfg.owner}/${this.cfg.repo}. Check the name, and that the token was given access to this repository.` };
    if (!r.ok) throw { kind: "other", msg: "GitHub returned an error (" + r.status + "). Try again in a minute." };
    const j = await r.json();
    if (!j.private) throw { kind: "public", msg: `${this.cfg.owner}/${this.cfg.repo} is public. Make it private first, so your plans stay private.` };
  },
  async pull() {
    const r = await this.req(this.repoPath() + "/contents/" + DATA_PATH);
    if (r.status === 404) return { docs: {}, sha: null };
    if (r.status === 401) throw { kind: "auth" };
    if (!r.ok) throw { kind: "other", status: r.status };
    const j = await r.json();
    let text = j.content ? b64dec(j.content) : "";
    if (!text && j.sha) { // files over 1 MB come through the blob API
      const br = await this.req(this.repoPath() + "/git/blobs/" + j.sha);
      if (!br.ok) throw { kind: "other", status: br.status };
      text = b64dec((await br.json()).content);
    }
    let docs = {}; try { docs = (JSON.parse(text || "{}").docs) || {}; } catch (e) {}
    return { docs, sha: j.sha };
  },
  async push(docs, sha) {
    const body = { message: "Update plans " + new Date().toISOString().slice(0, 16).replace("T", " "),
      content: b64enc(JSON.stringify({ app: "hourbox", version: 1, updated: new Date().toISOString(), docs })) };
    if (sha) body.sha = sha;
    const r = await this.req(this.repoPath() + "/contents/" + DATA_PATH, { method: "PUT", body: JSON.stringify(body), headers: { "Content-Type": "application/json" } });
    if (r.status === 409 || r.status === 422) return { conflict: true };
    if (r.status === 401) throw { kind: "auth" };
    if (r.status === 403 || r.status === 404) throw { kind: "write" };
    if (!r.ok) throw { kind: "other", status: r.status };
    const j = await r.json();
    return { sha: j.content.sha };
  }
};

const Store = {
  dirty: new Set(), inflight: false, timer: null, sha: null, pending: { size: 0 },
  get busy() { return this.dirty.size > 0 || this.inflight; },
  async init() {
    const cfg = lsGet(CFG_KEY); const cache = lsGet(LS_KEY);
    if (cache && cache.docs) { S.docs = cache.docs; this.sha = cache.sha || null; } else if (cache && !cache.docs) { S.docs = cache; }
    if (cfg && cfg.mode === "local") { S.mode = "local"; S.ready = true; setSync("local", "This device only"); setBanner("Sync is off, so these plans are saved on this device only. <a href=\"#\" data-act=\"settings\">Connect GitHub</a> to sync."); render(); return; }
    if (!cfg || !cfg.token) { S.mode = "setup"; S.ready = true; setSync("local", "Logged out"); render(); return; }
    GH.cfg = cfg; S.mode = "gh"; S.ready = true; render();
    startSyncLoop();
    await this.refresh(true);
  },
  cache() { lsSet(LS_KEY, { docs: S.docs, sha: this.sha }); },
  async refresh(first) {
    if (S.mode !== "gh" || this.busy) return;
    if (first) setSync("saving", "Syncing…");
    try {
      const remote = await GH.pull();
      if (this.busy) return; // you edited while we were fetching; your save will merge
      const localOnly = first && !this.sha ? Object.keys(S.docs).filter(id => !(id in remote.docs)) : [];
      if (remote.sha !== this.sha || first) {
        S.docs = Object.assign({}, remote.docs, Object.fromEntries(localOnly.map(id => [id, S.docs[id]])));
        this.sha = remote.sha; this.cache();
        if (!modalOpen()) render();
      }
      if (localOnly.length) { localOnly.forEach(id => this.dirty.add(id)); this.flush(); }
      else setSync("ok", "Synced");
      setBanner("");
    } catch (e) { this.fail(e); }
  },
  save(id) {
    this.dirty.add(id); this.cache();
    if (S.mode !== "gh") { setSync("local", S.mode === "local" ? "This device only" : "Not connected"); this.dirty.clear(); return; }
    setSync("saving", "Saving…");
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1200);
  },
  flushNow() { if (this.dirty.size && !this.inflight) { clearTimeout(this.timer); this.flush(); } },
  async flush() {
    if (this.inflight || !this.dirty.size || S.mode !== "gh") return;
    this.inflight = true;
    const mine = new Set(this.dirty); this.dirty.clear();
    let merged = false;
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const res = await GH.push(S.docs, this.sha);
        if (!res.conflict) { this.sha = res.sha; break; }
        // Another device saved first: take theirs, then lay your changed days back on top.
        const remote = await GH.pull();
        const next = Object.assign({}, remote.docs);
        for (const id of new Set([...mine, ...this.dirty])) if (S.docs[id]) next[id] = S.docs[id];
        S.docs = next; this.sha = remote.sha; merged = true;
        if (attempt === 3) throw { kind: "other" };
      }
      this.cache();
      if (merged && !modalOpen()) render();
      setSync("ok", "Synced"); setBanner("");
    } catch (e) { mine.forEach(id => this.dirty.add(id)); this.fail(e); }
    finally {
      this.inflight = false;
      if (this.dirty.size) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 5000); }
    }
  },
  fail(e) {
    const k = e && e.kind;
    if (k === "auth") { setSync("error", "Token expired"); setBanner("GitHub stopped accepting this device’s token. <a href=\"#\" data-act=\"settings\">Paste a new token</a>. Your changes are kept on this device until then."); }
    else if (k === "write") { setSync("error", "Can’t save"); setBanner("The token can read but not write. Give it <b>Contents: Read and write</b> access, then <a href=\"#\" data-act=\"settings\">paste it again</a>."); }
    else { setSync("offline", "Offline"); setBanner("Can’t reach GitHub right now. Your changes are saved on this device and will sync when the connection is back."); }
  }
};
window.addEventListener("beforeunload", e => { if (Store.busy && S.mode === "gh") { Store.flushNow(); e.preventDefault(); } });

// ---------- login: a password-encrypted copy of the token ----------
// The token is encrypted in this browser (PBKDF2-SHA256 600k rounds -> AES-256-GCM) and only the
// encrypted file is saved to the public app repo at vaults/<username>.json. Without the password it is useless.
const LASTUSER_KEY = "hourbox-lastuser";
const VAULT_ITER = 600000;
const onPages = location.hostname.endsWith(".github.io");
const APP_OWNER = (onPages && location.hostname.split(".")[0]) || "segaldev";
const APP_REPO = (onPages && location.pathname.split("/")[1]) || "hourbox";
const cleanUser = v => String(v || "").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "");
const u8b64 = u8 => { let s = ""; u8.forEach(c => s += String.fromCharCode(c)); return btoa(s); };
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function makeVault(pw, payload) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, VAULT_ITER);
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(payload))));
  return { app: "hourbox", v: 1, kdf: "PBKDF2-SHA256", iter: VAULT_ITER, salt: u8b64(salt), iv: u8b64(iv), ct: u8b64(ct) };
}
async function openVault(v, pw) {
  const key = await deriveKey(pw, b64u8(v.salt), v.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u8(v.iv) }, key, b64u8(v.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function fetchVault(user) {
  try { const r = await fetch(`vaults/${encodeURIComponent(user)}.json?t=${Date.now()}`, { cache: "no-store" }); if (!r.ok) return null; const v = await r.json(); return v && v.ct ? v : null; }
  catch (e) { return null; }
}

function tokenFormHTML(cfg) {
  return `<form class="setup-form" data-form="setup">
      <div class="field"><label for="su-owner">GitHub username</label><input type="text" id="su-owner" value="${esc(cfg.owner || APP_OWNER)}" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="su-repo">Private data repo</label><input type="text" id="su-repo" value="${esc(cfg.repo || "hourbox-data")}" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="su-token">Access token</label><input type="password" id="su-token" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <p class="hint" id="su-msg" role="status"></p>
      <div class="setup-actions"><button class="btn ${cfg.token ? "" : "primary"}" type="submit" id="su-go">${cfg.token ? "Replace token" : "Connect"}</button></div>
    </form>`;
}
const tokenSteps = `<ol class="steps">
      <li><b>Check the data repo exists and is private.</b> It’s called <code>hourbox-data</code>. If it’s missing, <a href="https://github.com/new" target="_blank" rel="noopener">create it</a> and choose <i>Private</i>.</li>
      <li><b>Create an access token</b> on <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub’s fine-grained token page</a>:
        <ul><li>Repository access: <i>Only select repositories</i> → <code>hourbox-data</code></li>
        <li>Permissions → Repository permissions → <i>Contents</i>: <b>Read and write</b></li>
        <li>Pick an expiration you’re comfortable with, then <i>Generate token</i> and copy it.</li></ul></li>
      <li><b>Paste it below.</b> Once connected, open Account settings to set a password so you never need the token again.</li>
    </ol>`;

function renderSetup() {
  const cfg = lsGet(CFG_KEY) || {}; const connected = cfg.token && cfg.mode !== "local";
  const lastUser = lsGet(LASTUSER_KEY) || cfg.loginUser || APP_OWNER;
  if (connected) return `<section class="pane setup">
    <div class="pane-head"><h2>Account</h2></div>
    <p>This device is logged in and syncing with your private repo <b>${esc(cfg.owner)}/${esc(cfg.repo)}</b>.</p>
    <div class="setup-actions"><button class="btn primary" type="button" data-act="setup-back" id="su-back">Back to planner</button><button class="btn ghost" type="button" data-act="disconnect" id="su-disc">Log out of this device</button></div>
    <hr class="sep">
    <p class="sect-title">Password login</p>
    <p>Set a password so you can log in on any device with your username and password. You won’t need the token again.</p>
    <p class="hint" id="pw-state">Checking for an existing password…</p>
    <form class="setup-form" data-form="setpw">
      <div class="field"><label for="pw-user">Username</label><input type="text" id="pw-user" value="${esc(lastUser)}" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="pw-new">New password</label><input type="password" id="pw-new" autocomplete="new-password"></div>
      <div class="field"><label for="pw-new2">Repeat password</label><input type="password" id="pw-new2" autocomplete="new-password"></div>
      <p class="hint">Use at least 12 characters, and don’t reuse a password from another site. A few random words work well. Let your password manager save it.</p>
      <p class="hint err" id="pw-msg" role="status"></p>
      <div class="setup-actions"><button class="btn primary" type="submit" id="pw-go">Create password file</button></div>
    </form>
    <div id="pw-out"></div>
    <hr class="sep">
    <details><summary>Replace the access token</summary><p class="hint">Use this when your token expires. Afterwards, set your password again so the saved file holds the new token.</p>${tokenFormHTML(cfg)}</details>
  </section>`;
  return `<section class="pane setup">
    <div class="pane-head"><h2>Log in to Hourbox</h2></div>
    <p>Your plans live in a <b>private</b> GitHub repository in your account. Only you can read it.</p>
    <form class="setup-form" data-form="login">
      <div class="field"><label for="li-user">Username</label><input type="text" id="li-user" value="${esc(lastUser)}" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label for="li-pw">Password</label><input type="password" id="li-pw" autocomplete="current-password"></div>
      <p class="hint err" id="li-msg" role="status"></p>
      <div class="setup-actions"><button class="btn primary" type="submit" id="li-go">Log in</button><button class="btn ghost" type="button" data-act="use-local" id="su-local">Use without sync for now</button></div>
    </form>
    <hr class="sep">
    <details id="tok-details"><summary>First time, or no password yet? Connect with an access token</summary>${tokenSteps}${tokenFormHTML(cfg)}</details>
  </section>`;
}
async function setupAfterRender() {
  const st = $("#pw-state"); if (!st) return;
  const user = cleanUser($("#pw-user").value); const v = user && await fetchVault(user);
  if ($("#pw-state") !== st) return;
  st.textContent = v ? `A password is already set up for “${user}”. Creating a new one replaces it.` : "No password is set up yet.";
}
function startSyncLoop() {
  if (Store._started) return; Store._started = true;
  setInterval(() => Store.refresh(), 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Store.refresh(); else Store.flushNow(); });
  window.addEventListener("pagehide", () => Store.flushNow());
}

    return false;

  if (fromLogin) lsSet(LASTUSER_KEY, fromLogin);

function summarize(d) {

  return { planned: bs.length, done: bs.filter(b => b.status === "done").length, partial: bs.filter(b => b.status === "partial").length,
    skipped: bs.filter(b => b.status === "skipped").length, plannedMin: mins(() => true), doneMin: mins(b => b.status === "done"),
    prTotal: pr.length, prDone: pr.filter(p => p.done).length };
}

    <div class="cells">${ks.map(key => slotBox(d, key, ro, n, nowMin)).join("")}</div></div>`;
}
function slotBox(d, key, ro, n, nowMin) {

  const sub = n > 1 ? `<span class="smin">${timeLabel(m0).replace(/\s?[AP]M$/i, "")}</span>` : "";

    </div>`;

function setSplit(h) {
  const k = S.date, d0 = getDay(k), cur = splitOf(d0, h), n = cur === 1 ? 2 : cur === 2 ? 4 : 1;
  let bumped = [];
  mutateDay(k, d => {
    const old = Object.keys(d.boxes).filter(key => hourOfKey(key) === h).sort((a, b) => minOfKey(a) - minOfKey(b)).map(key => [key, d.boxes[key]]);
    old.forEach(([key]) => delete d.boxes[key]);

      while (i < ks.length && d.boxes[ks[i]]) i++;

function placeNowLine() {

function renderMonth() {
  const m = S.date.slice(0, 7), mo = getMonth(m), first = parseKey(m + "-01");
  const goals = mo.goals.map((g, i) => `<li><span class="prio-n">${i + 1}</span><input type="text" id="mg-${i}" data-input="goal" data-i="${i}" value="${esc(g)}" placeholder="${i === 0 ? "A goal for this month" : "Another goal"}" maxlength="140"></li>`).join("");
  const offset = (first.getDay() + 6) % 7; // Monday first
  const startD = new Date(first); startD.setDate(1 - offset);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const cells = Math.ceil((offset + last.getDate()) / 7) * 7;
  let html = ""; const tk = todayKey();
  for (let i = 0; i < cells; i++) {
    const dd = new Date(startD); dd.setDate(startD.getDate() + i); const k = keyOf(dd);
    const d = hasDay(k) ? getDay(k) : null; const sm = d ? summarize(d) : null;
    const pr = d ? d.prio.filter(p => p.text.trim()) : [];
    let bar = "";
    if (sm && sm.planned) { const n = Math.min(Math.ceil(sm.plannedMin / 60), 12), dn = Math.round(sm.doneMin / 60); for (let j = 0; j < n; j++) bar += `<i class="${j < dn ? "d" : "f"}"></i>`; }
    html += `<button class="dcell ${k.slice(0, 7) !== m ? "out" : ""} ${k === tk ? "today" : ""}" id="dc-${k}" data-act="open-day" data-k="${k}" aria-label="${dd.toDateString()}">
      <span class="dn"><span>${dd.getDate()}</span>${d && d.finished ? `<span class="fin" title="Finished">✓</span>` : ""}</span>
      ${pr.slice(0, 3).map(p => `<span class="dp ${p.done ? "done" : ""}">${esc(p.text)}</span>`).join("")}
      ${sm && sm.planned ? `<span class="dcount">${fmtDur(sm.doneMin)}/${fmtDur(sm.plannedMin)} done</span>` : ""}
      <span class="dbar">${bar}</span></button>`;
  }
  const wd = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(w => `<div>${w}</div>`).join("");
  return `<div class="month">
    <section class="pane goals"><div class="pane-head"><h2>Goals for ${first.toLocaleDateString([], { month: "long" })}</h2><span class="hint">Up to 5</span></div><ol>${goals}</ol></section>
    <div class="cal"><div class="cal-head">${wd}</div><div class="cal-grid">${html}</div></div>
    <p class="hint">Tap any day to open it. Past days show what you planned and how it went. Future days can be planned ahead.</p>
  </div>`;
}

// ---------- actions ----------
function srcText(src) {
  const d = getDay(S.date);
  if (src.from === "prio") return d.prio[src.i].text;
  if (src.from === "dump") return (d.dump.find(x => x.id === src.id) || {}).text;
  if (src.from === "park") return (getPark().items.find(x => x.id === src.id) || {}).text;
  if (src.from === "box") return (d.boxes[src.h] || {}).text;
}
function place(src, h) {
  const k = S.date; const d0 = getDay(k);
  if (d0.finished) { toast("This day is finished. Reopen it to make changes."); return; }
  if (src.from === "box" && String(src.h) === String(h)) { S.placing = null; render(); return; }
  let parkItem = null; let bumped = null;
  if (src.from === "park") { parkItem = getPark().items.find(x => x.id === src.id); if (!parkItem) return; }
  mutateDay(k, d => {
    const existing = d.boxes[h];
    let box;
    if (src.from === "prio") box = { text: d.prio[src.i].text.trim(), pi: src.i, status: "planned" };
    else if (src.from === "dump") { const it = d.dump.find(x => x.id === src.id); if (!it) return; box = { text: it.text, status: "planned" }; d.dump = d.dump.filter(x => x.id !== src.id); }
    else if (src.from === "park") box = { text: parkItem.text, status: "planned" };
    else if (src.from === "box") { box = d.boxes[src.h]; delete d.boxes[src.h]; if (existing) d.boxes[src.h] = existing; }
    if (existing && src.from !== "box") { bumped = existing.text; if (existing.pi == null) d.dump.push({ id: rid(), text: existing.text }); }
    d.boxes[h] = box;
  }, { silent: true });
  if (parkItem) mutatePark(p => { p.items = p.items.filter(x => x.id !== src.id); }, { silent: true });
  S.placing = null; render();
  if (src.from === "box" && getDay(k).boxes[src.h]) toast("Swapped the two boxes.");
  else if (bumped) toast(`“${bumped}” went back to the brain dump.`);
}
function cycleStatus(h) {
  const order = ["planned", "done", "partial", "skipped"];
  mutateDay(S.date, d => { const b = d.boxes[h]; b.status = order[(order.indexOf(b.status || "planned") + 1) % order.length]; });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, k = S.date;
  const ro = S.view === "day" && getDay(k).finished;
  switch (act) {
    case "view": S.view = t.dataset.v; S.placing = null; if (S.mode !== "setup") S.showSetup = false; render(); break;
    case "nav": S.placing = null;
      if (S.view === "day") S.date = addDays(S.date, +t.dataset.d);
      else { const d = parseKey(S.date); d.setDate(1); d.setMonth(d.getMonth() + +t.dataset.d); S.date = keyOf(d); }
      render(); break;
    case "today": S.date = todayKey(); S.placing = null; render(); break;
    case "open-day": S.date = t.dataset.k; S.view = "day"; render(); window.scrollTo(0, 0); break;
    case "prio-done": mutateDay(k, d => { d.prio[+t.dataset.i].done = t.checked; }); break;
    case "pick": {
      const src = t.dataset.from === "prio" ? { from: "prio", i: +t.dataset.i } : { from: t.dataset.from, id: t.dataset.id };
      const same = S.placing && S.placing.from === src.from && (S.placing.i === src.i && S.placing.id === src.id);
      S.placing = same ? null : Object.assign(src, { text: srcText(src) });
      render();
      if (S.placing && window.matchMedia("(max-width: 820px)").matches) $("#hours")?.scrollIntoView({ behavior: "smooth", block: "start" });
      break; }
    case "cancel-place": S.placing = null; render(); break;
    case "cycle": e.stopPropagation(); if (ro) { toast("This day is finished. Reopen it to make changes."); break; } cycleStatus(t.dataset.h); break;
    case "split": if (ro) { toast("This day is finished. Reopen it to make changes."); break; } setSplit(+t.dataset.h); break;
    case "box": {
      const h = t.dataset.h;
      if (S.placing) { place(S.placing, h); break; }
      if (ro) { if (getDay(k).boxes[h]) toast("This day is finished. Reopen it to make changes."); break; }
      openBoxEditor(h); break; }
    case "del-item": {
      if (t.dataset.from === "dump") mutateDay(k, d => { d.dump = d.dump.filter(x => x.id !== t.dataset.id); });
      else mutatePark(p => { p.items = p.items.filter(x => x.id !== t.dataset.id); });
      if (S.placing && S.placing.id === t.dataset.id) S.placing = null; break; }
    case "to-park": {
      const it = getDay(k).dump.find(x => x.id === t.dataset.id); if (!it) break;
      mutateDay(k, d => { d.dump = d.dump.filter(x => x.id !== it.id); }, { silent: true });
      mutatePark(p => { p.items.push({ id: rid(), text: it.text }); }); toast("Moved to the parking lot."); break; }
    case "to-dump": {
      if (getDay(k).finished) { toast("This day is finished. Reopen it to make changes."); break; }
      const it = getPark().items.find(x => x.id === t.dataset.id); if (!it) break;
      mutatePark(p => { p.items = p.items.filter(x => x.id !== it.id); }, { silent: true });
      mutateDay(k, d => { d.dump.push({ id: rid(), text: it.text }); }); toast("Added to this day’s brain dump."); break; }
    case "ext": {
      const d0 = getDay(k); const filled = Object.keys(d0.boxes).map(hourOfKey);
      const s = Math.min(d0.start, ...filled), en = Math.max(d0.end, ...filled.map(n => n + 1));
      mutateDay(k, d => {
        if (t.dataset.w === "up") d.start = Math.max(0, s - 1);
        if (t.dataset.w === "down") d.end = Math.min(24, en + 1);
        if (t.dataset.w === "up-hide") d.start = s + 1;
        if (t.dataset.w === "down-hide") d.end = en - 1;
      }); break; }
    case "finish": openFinish(); break;
    case "settings": e.preventDefault(); S.showSetup = true; S.placing = null; render(); window.scrollTo(0, 0); break;
    case "setup-back": S.showSetup = false; render(); break;
    case "use-local": lsSet(CFG_KEY, { mode: "local" }); S.mode = "local"; S.showSetup = false; setSync("local", "This device only"); setBanner("Sync is off, so these plans are saved on this device only. <a href=\"#\" data-act=\"settings\">Connect GitHub</a> to sync."); render(); break;
    case "disconnect": lsSet(CFG_KEY, null); lsSet(LS_KEY, null); S.docs = {}; Store.sha = null; GH.cfg = null; Store.dirty.clear(); S.mode = "setup"; S.showSetup = false; setSync("local", "Logged out"); render(); toast("Logged out. This device’s copy of your plans was removed."); break;
    case "copy-vault": {
      const ta = $("#vault-text"); const done = () => toast("Copied.");
      const fallback = () => { ta.focus(); ta.select(); toast("Text selected. Press Cmd+C to copy."); };
      try { navigator.clipboard.writeText(ta.value).then(done, fallback); } catch (err) { fallback(); }
      break; }
    case "reopen": mutateDay(k, d => { d.finished = false; }); toast("Day reopened. Finish it again when you’re done."); break;
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".box[data-act]")) { e.preventDefault(); e.target.click(); }
  if (e.key === "Escape") { if (modalOpen()) closeModal(); else if (S.placing) { S.placing = null; render(); } }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.dataset.form === "setup") { connectSetup(); return; }
  if (f.dataset.form === "login") { loginSubmit(); return; }
  if (f.dataset.form === "setpw") { setPassword(); return; }
  const inp = f.querySelector("input"); const text = inp.value.trim(); if (!text) return;
  if (f.dataset.form === "dump") mutateDay(S.date, d => { d.dump.push({ id: rid(), text }); });
  else mutatePark(p => { p.items.push({ id: rid(), text }); });
  const el = document.getElementById(inp.id); if (el) { el.value = ""; el.focus(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.input === "prio") {
    mutateDay(S.date, d => { d.prio[+t.dataset.i].text = t.value; Object.values(d.boxes).forEach(b => { if (b.pi === +t.dataset.i) b.text = t.value.trim() || b.text; }); }, { silent: true });
    clearTimeout(t._r); t._r = setTimeout(render, 700);
  } else if (t.dataset.input === "goal") {
    const m = S.date.slice(0, 7); mutate("month-" + m, getMonth(m), mo => { mo.goals[+t.dataset.i] = t.value; }, { silent: true });
  }
});
$("#datejump").addEventListener("change", e => { if (e.target.value) { S.date = e.target.value; S.placing = null; render(); } });

// drag & drop (desktop)
let dragSrc = null;
document.addEventListener("dragstart", e => {
  const el = e.target.closest("[data-drag]"); if (!el) return;
  dragSrc = JSON.parse(el.dataset.drag); e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", srcText(dragSrc) || ""); } catch (err) {}
});
document.addEventListener("dragend", () => { dragSrc = null; document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop")); });
document.addEventListener("dragover", e => {
  const c = e.target.closest("[data-drop]"); if (!c || !dragSrc) return; e.preventDefault();
  document.querySelectorAll(".drop").forEach(x => x !== c.firstElementChild && x.classList.remove("drop"));
  c.firstElementChild.classList.add("drop");
});
document.addEventListener("drop", e => {
  const c = e.target.closest("[data-drop]"); if (!c || !dragSrc) return; e.preventDefault();
  const src = dragSrc; dragSrc = null; place(src, c.dataset.drop);
});

// ---------- modals ----------
const modalOpen = () => !!$("#modal-root").firstChild;
function closeModal() { $("#modal-root").innerHTML = ""; render(); }
function openModal(html, onClick) {
  const root = $("#modal-root");
  root.innerHTML = `<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = $("#overlay");
  ov.addEventListener("click", e => { if (e.target === ov) closeModal(); const b = e.target.closest("[data-m]"); if (b) onClick(b, e); });
  return ov;
}

function openBoxEditor(h) {
  const k = S.date, d = getDay(k), b = d.boxes[h] ? clone(d.boxes[h]) : { text: "", tag: "", status: "planned" };
  const isNew = !d.boxes[h], len = lenOfKey(d, h), nk = nextSlot(d, h);
  const tagChips = () => TAGS.map(([v, n]) => `<button class="chip tag-chip ${v ? "tg-" + v : ""}" data-m="tag" data-v="${v}" aria-pressed="${(b.tag || "") === v}">${n}</button>`).join("");
  const stChips = () => [["planned", "Planned"], ["done", "Done"], ["partial", "Partly done"], ["skipped", "Skipped"]].map(([v, n]) => `<button class="chip s-${v}" data-m="st" data-v="${v}" aria-pressed="${(b.status || "planned") === v}">${n}</button>`).join("");
  const ov = openModal(`
    <header><span class="eyebrow">${slotRange(d, h)}</span><h3>${isNew ? (len === 60 ? "Box this hour" : `Box these ${len} minutes`) : "Edit this box"}</h3></header>
    <div class="body">
      <div class="field"><label for="be-text">What will you do?</label><input type="text" id="be-text" value="${esc(b.text)}" maxlength="140" placeholder="One focused activity"></div>
      <div class="field"><span class="lbl">Tag</span><div class="chips" id="be-tags">${tagChips()}</div></div>
      ${isNew ? "" : `<div class="field"><span class="lbl">Status</span><div class="chips" id="be-st">${stChips()}</div></div>`}
    </div>
    <footer>
      ${isNew ? "" : `<div class="left">
        <button class="btn ghost" data-m="next" id="be-next" ${!nk || d.boxes[nk] ? "disabled" : ""} title="${nk && d.boxes[nk] ? "The next box is already booked" : ""}">${nk ? `Continue into ${timeLabel(minOfKey(nk))}` : "Continue into next box"}</button>
        <button class="btn ghost" data-m="move" id="be-move">Move…</button>
        <button class="btn ghost" data-m="unbox" id="be-unbox">Back to brain dump</button>
        <button class="btn ghost" data-m="clear" id="be-clear">Delete</button></div>`}
      <button class="btn" data-m="cancel" id="be-cancel">Cancel</button>
      <button class="btn primary" data-m="save" id="be-save">Save</button>
    </footer>`, (btn) => {
      const m = btn.dataset.m;
      b.text = $("#be-text").value;
      if (m === "tag") { b.tag = btn.dataset.v; $("#be-tags").innerHTML = tagChips(); }
      if (m === "st") { b.status = btn.dataset.v; $("#be-st").innerHTML = stChips(); }
      if (m === "cancel") closeModal();
      if (m === "save") {
        const text = b.text.trim(); if (!text) { $("#be-text").focus(); toast("Type what you’ll do in this hour."); return; }
        mutateDay(k, dd => { dd.boxes[h] = Object.assign({}, b, { text }); }, { silent: true }); closeModal();
      }
      if (m === "next") {
        const text = b.text.trim(); if (!text) return;
        if (!nk) return;
        mutateDay(k, dd => { dd.boxes[h] = Object.assign({}, b, { text }); dd.boxes[nk] = Object.assign({}, b, { text, status: "planned" }); if (dd.end < hourOfKey(nk) + 1) dd.end = hourOfKey(nk) + 1; }, { silent: true });
        closeModal(); toast(`Continued into ${timeLabel(minOfKey(nk))}.`);
      }
      if (m === "move") { $("#modal-root").innerHTML = ""; S.placing = { from: "box", h, text: d.boxes[h].text }; render(); }
      if (m === "unbox") { mutateDay(k, dd => { const x = dd.boxes[h]; delete dd.boxes[h]; if (x.pi == null) dd.dump.push({ id: rid(), text: x.text }); }, { silent: true }); closeModal(); }
      if (m === "clear") { mutateDay(k, dd => { delete dd.boxes[h]; }, { silent: true }); closeModal(); }
    });
  const inp = $("#be-text"); inp.focus(); inp.select();
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); ov.querySelector("#be-save").click(); } });
}

function openFinish() {
  const k = S.date, d = getDay(k), tomorrow = addDays(k, 1);
  const st = {}; Object.entries(d.boxes).forEach(([h, b]) => st[h] = b.status || "planned");
  const dest = {}; const refl = { well: "", blocked: "", change: "", energy: 0 };
  const hrs = sortedKeys(d);
  const leftovers = () => {
    const L = [];
    d.prio.forEach((p, i) => { if (p.text.trim() && !p.done) L.push({ key: "p" + i, text: p.text.trim(), kind: "Priority", def: "tomorrow" }); });
    hrs.forEach(h => { if ((st[h] === "skipped" || st[h] === "partial") && d.boxes[h].pi == null) L.push({ key: "b" + h, text: d.boxes[h].text, kind: st[h] === "skipped" ? "Skipped hour" : "Partly done", def: "tomorrow" }); });
    d.dump.forEach(it => L.push({ key: "d" + it.id, text: it.text, kind: "Brain dump", def: "drop" }));
    const seen = new Set(); return L.filter(x => { const s = x.text.toLowerCase(); if (seen.has(s)) return false; seen.add(s); return true; });
  };
  const revHTML = () => hrs.length ? hrs.map(h => `<div class="rev-row"><span class="t">${timeLabel(minOfKey(h))}</span><span class="x">${esc(d.boxes[h].text)}</span>
      <div class="chips">${[["done", "Done"], ["partial", "Partly"], ["skipped", "Skipped"]].map(([v, n]) => `<button class="chip s-${v}" data-m="st" data-h="${h}" data-v="${v}" aria-pressed="${st[h] === v}">${n}</button>`).join("")}</div></div>`).join("")
    : `<p class="hint">No hours were boxed today.</p>`;
  const leftHTML = () => { const L = leftovers(); return L.length ? L.map(x => { const v = dest[x.key] || x.def; return `<div class="rev-row"><span class="t">${esc({ "Priority": "Priority", "Skipped hour": "Box", "Partly done": "Box", "Brain dump": "Dump" }[x.kind])}</span><span class="x">${esc(x.text)}</span>
      <div class="chips">${[["tomorrow", "Tomorrow"], ["park", "Parking lot"], ["drop", "Let go"]].map(([dv, n]) => `<button class="chip" data-m="dest" data-k="${esc(x.key)}" data-v="${dv}" aria-pressed="${v === dv}">${n}</button>`).join("")}</div></div>`; }).join("")
    : `<p class="hint">Nothing left over. Nice.</p>`; };
  const energyHTML = () => [1, 2, 3, 4, 5].map(n => `<button class="chip" data-m="energy" data-v="${n}" aria-pressed="${refl.energy === n}">${n}</button>`).join("");
  openModal(`
    <header><span class="eyebrow">${parseKey(k).toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" })}</span><h3>Finish the day</h3></header>
    <div class="body">
      <div><p class="sect-title">How did each hour go?</p><div class="rev" id="fd-rev">${revHTML()}</div></div>
      <div><p class="sect-title">Leftovers</p><p class="hint" style="margin:0 0 4px">“Tomorrow” adds unfinished priorities to tomorrow’s priorities and everything else to tomorrow’s brain dump.</p><div class="rev" id="fd-left">${leftHTML()}</div></div>
      <div><p class="sect-title">Reflection <span class="hint">(optional)</span></p>
        <div class="body" style="padding:0;gap:10px">
          <div class="field"><label for="fd-well">What went well?</label><textarea id="fd-well" rows="2"></textarea></div>
          <div class="field"><label for="fd-blocked">What got in the way?</label><textarea id="fd-blocked" rows="2"></textarea></div>
          <div class="field"><label for="fd-change">One thing to change tomorrow</label><textarea id="fd-change" rows="2"></textarea></div>
          <div class="field"><span class="lbl">Energy</span><div class="chips energy" id="fd-energy">${energyHTML()}</div></div>
        </div></div>
    </div>
    <footer><button class="btn" data-m="cancel" id="fd-cancel">Not yet</button><button class="btn primary" data-m="done" id="fd-done">Finish day</button></footer>`,
    (btn) => {
      const m = btn.dataset.m;
      if (m === "st") { st[btn.dataset.h] = btn.dataset.v; $("#fd-rev").innerHTML = revHTML(); $("#fd-left").innerHTML = leftHTML(); }
      if (m === "dest") { dest[btn.dataset.k] = btn.dataset.v; $("#fd-left").innerHTML = leftHTML(); }
      if (m === "energy") { refl.energy = refl.energy === +btn.dataset.v ? 0 : +btn.dataset.v; $("#fd-energy").innerHTML = energyHTML(); }
      if (m === "cancel") closeModal();
      if (m === "done") {
        refl.well = $("#fd-well").value.trim(); refl.blocked = $("#fd-blocked").value.trim(); refl.change = $("#fd-change").value.trim();
        const L = leftovers(); const toTom = { prio: [], dump: [] }, toPark = [];
        L.forEach(x => { const v = dest[x.key] || x.def; if (v === "tomorrow") (x.kind === "Priority" ? toTom.prio : toTom.dump).push(x.text); else if (v === "park") toPark.push(x.text); });
        mutateDay(k, dd => { Object.entries(st).forEach(([h, s]) => { if (dd.boxes[h]) dd.boxes[h].status = s; }); dd.finished = true; dd.finishedAt = new Date().toISOString(); dd.reflection = refl; dd.summary = summarize(dd); }, { silent: true });
        if (toTom.prio.length || toTom.dump.length) mutateDay(tomorrow, td => {
          toTom.prio.forEach(text => { const slot = td.prio.findIndex(p => !p.text.trim()); if (slot >= 0) td.prio[slot] = { text, done: false }; else td.dump.push({ id: rid(), text }); });
          toTom.dump.forEach(text => td.dump.push({ id: rid(), text }));
        }, { silent: true });
        if (toPark.length) mutatePark(p => { toPark.forEach(text => p.items.push({ id: rid(), text })); }, { silent: true });
        closeModal(); window.scrollTo(0, 0);
        const moved = toTom.prio.length + toTom.dump.length;
        toast(moved ? `Day finished. ${moved} item${moved > 1 ? "s" : ""} moved to tomorrow.` : "Day finished.");
      }
    });
}

// ---------- clock ----------
let lastDay = todayKey();
setInterval(() => {
  if (modalOpen()) return;
  const tk = todayKey();
  if (tk !== lastDay) { if (S.date === lastDay) S.date = tk; lastDay = tk; render(); return; }
  if (S.view === "day" && S.date === tk && S.ready) {
    const a = document.activeElement; if (a && a.matches("input,textarea")) { document.querySelector(".nowline")?.remove(); placeNowLine(); return; }
    render();
  }
}, 60000);

renderHeader();
Store.init();
})();
</script>
</body>
