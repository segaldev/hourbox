[data-style="deep"] .hour.now .box.filled, [data-style="deep"] .box.filled.nowslot { box-shadow: 0 0 0 1px var(--accent), 0 0 22px var(--glow); }
[data-style="deep"] .nowline { box-shadow: 0 0 10px var(--now); }
[data-style="mist"] :is(.pane, .a-grid, .cal, .banner, .welcome) { -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
[data-style="mist"] :is(.btn, .chip, .seg, .seg button, .iconbtn, .dchip) { border-radius: 999px; }
[data-style="mist"] :is(.brand, .pane h2, .gridhead h2, .modal h3, .sect-title, .welcome-brand h1, .welcome-lead, .datepick label, .stat b, .dcell .dn > span:first-child, .cal-head div) { font-weight: 400; }
[data-style="mist"] :is(.brand, .pane h2, .gridhead h2, .modal h3, .welcome-brand h1) { font-style: italic; letter-spacing: 0; }
[data-style="mist"] :is(.brand) { font-size: 25px; } [data-style="mist"] :is(.pane h2) { font-size: 19px; } [data-style="mist"] .gridhead h2 { font-size: 23px; }
[data-style="sage"] .top { background-image: none; }
* { box-sizing: border-box; }
/* no pull-to-refresh: plans sync live, so a pull down just scrolls */
html, body { overscroll-behavior-y: none; }
html { background-color: var(--desk); background-image: var(--bg-image); background-size: var(--bg-size); background-position: var(--bg-pos); background-repeat: var(--bg-repeat); background-attachment: fixed; min-height: 100%; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
body { background-color: var(--desk); background-image: var(--bg-image); background-size: var(--bg-size); background-position: var(--bg-pos); background-repeat: var(--bg-repeat); background-attachment: fixed; color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--desk); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background-color: var(--desk); background-image: var(--bg-image); background-size: var(--bg-size); background-position: var(--bg-pos); background-repeat: var(--bg-repeat); background-attachment: fixed; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 18px; height: 18px; border: 2.5px solid var(--ink); border-radius: 4px; position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; height: 2.5px; background: var(--now); }
.seg { display: inline-flex; background: var(--sunk); border-radius: var(--r); padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: var(--r-s); font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.datenav { display: flex; align-items: center; gap: 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); width: 34px; height: 34px; border-radius: var(--r); display: grid; place-items: center; font-size: 18px; line-height: 1; }
.datepick { position: relative; }
.datepick label { display: block; font-family: var(--f-display); font-weight: 500; font-size: 17px; padding: 4px 10px; border-radius: var(--r); cursor: pointer; white-space: nowrap; }
.datepick label:hover { background: var(--sunk); }
.datepick input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: var(--r); font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--pri-bg); color: var(--pri-fg); border-color: var(--pri-bd); }
.btn.primary:hover { background: var(--pri-hbg); color: var(--pri-hfg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--sunk); }
.top .btn.ghost { color: var(--ink); }
.sync { margin-left: auto; color: var(--ink) !important; white-space: nowrap; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.sync[data-s="saving"]::before { background: var(--partial); }
.sync[data-s="error"]::before, .sync[data-s="offline"]::before { background: var(--now); }
.sync[data-s="local"]::before { background: var(--muted); }

/* Day layout */
.day { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); grid-template-areas: "prio grid" "dump grid" "park grid" ". grid"; gap: 16px 24px; align-items: start; }
.a-prio { grid-area: prio; } .a-dump { grid-area: dump; } .a-park { grid-area: park; } .a-grid { grid-area: grid; }
@media (max-width: 820px) { .day { grid-template-columns: minmax(0, 1fr); grid-template-areas: "prio" "dump" "grid" "park"; } }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; min-width: 0; }
.pane h2, .gridhead h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 16px; letter-spacing: -.005em; }
.pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.hint { font-size: 12.5px; color: var(--muted); }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }

/* Priorities */
.prio-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prio-row { display: grid; grid-template-columns: 22px 20px minmax(0,1fr) auto auto; align-items: center; gap: 6px; padding: 4px 4px 4px 2px; border-radius: var(--r); }
.prio-row:hover { background: var(--sunk); }
.prio-n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: center; }
.prio-row input[type=text] { border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 4px 2px; min-width: 0; width: 100%; }
.prio-row input[type=text]:focus { outline: none; border-bottom-color: var(--accent); }
.prio-row.done input[type=text] { text-decoration: line-through; color: var(--muted); }
.check { appearance: none; width: 18px; height: 18px; border: 1.5px solid var(--muted); border-radius: var(--check-off-r); margin: 0; display: grid; place-items: center; cursor: pointer; background: var(--surface); }
.check:checked { background: var(--done-fill); border-color: var(--done); border-radius: var(--check-r); }
.check:checked::after { content: ""; width: 5px; height: 9px; border: solid var(--done-mark); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.badge { font-size: 11px; font-family: var(--f-mono); padding: 1px 6px; border-radius: var(--r); white-space: nowrap; }
.badge.on { background: var(--accent-soft); color: var(--accent); }
.badge.off { color: var(--muted); border: 1px dashed var(--line); }

/* Item lists */
.add { display: flex; gap: 6px; margin-bottom: 8px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 7px 10px; }
.add input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.items { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { display: flex; align-items: center; gap: 4px; padding: 5px 4px 5px 8px; border-radius: var(--r); min-width: 0; }
.item:hover { background: var(--sunk); }
.item .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item[draggable="true"] { cursor: grab; }
.item.picked, .prio-row.picked { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.mini { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: var(--r-s); display: grid; place-items: center; flex: none; font-size: 14px; }
.mini:hover { background: var(--surface); color: var(--ink); }
.mini svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.empty-note { color: var(--muted); font-size: 13px; padding: 6px 8px; }

/* Hour grid */
.a-grid { background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
.gridhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.gridhead .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gridhead h2 { font-size: 19px; }
.extend { display: flex; gap: 6px; justify-content: center; padding: 6px; background: var(--paper); }
.extend .btn { font-size: 12.5px; padding: 3px 10px; }
.hours { position: relative; }
.hour { display: grid; grid-template-columns: 64px minmax(0,1fr); min-height: 62px; border-top: 1px solid var(--line); }
.hour:first-child { border-top: 0; }
.hlabel { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 8px 10px 0 12px; text-align: right; font-variant-numeric: tabular-nums; border-right: 1px solid var(--line); }
.hour.now .hlabel { color: var(--now); font-weight: 500; }
.cells { display: grid; min-width: 0; }
.cell { position: relative; padding: 6px 8px; min-width: 0; }
.split-2 .cell, .split-4 .cell { padding: 3px 8px; }
.cells .cell + .cell { border-top: 1px dashed var(--line); }
.split-2 .box { min-height: 40px; }
.split-4 .box { min-height: 30px; padding: 2px 10px; gap: 8px; }
.split-4 .stbtn { width: 20px; height: 20px; }
.split-4 .box .btxt { font-size: 14px; }
.smin { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--muted); min-width: 34px; font-variant-numeric: tabular-nums; }
.box.empty .smin { color: var(--muted); opacity: .75; }
.box.nowslot .smin { color: var(--now); opacity: 1; font-weight: 500; }
.hlabel { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.splitbtn { font-family: var(--f-mono); font-size: 10.5px; line-height: 1; padding: 3px 5px; border-radius: var(--r-s); border: 1px dashed var(--line); background: transparent; color: var(--muted); opacity: 0; transition: opacity .12s; }
.hour:hover .splitbtn, .splitbtn:focus-visible, .splitbtn.on { opacity: 1; }
.splitbtn.on { border-style: solid; border-color: var(--accent); color: var(--accent); }
.splitbtn:hover { color: var(--ink); border-color: var(--muted); }
@media (hover: none) { .splitbtn { opacity: .8; } }
.box { width: 100%; height: 100%; min-height: 50px; border-radius: var(--r); border: 1.5px dashed transparent; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; padding: 6px 10px; transition: background .12s, border-color .12s; }
.box.empty { color: transparent; }
.box.empty:hover, .placing .box.empty { border-color: var(--line); color: var(--muted); }
.box.empty .plus { font-size: 13px; }
.box.filled { background: var(--box-bg); border: 1px solid var(--box-border); cursor: pointer; }
.box.filled:hover { border-color: var(--muted); }
.box.drop.copying::after { content: "+ Copy"; margin-left: auto; font-size: 12px; font-weight: 600; }
.box.drop { border-color: var(--accent) !important; background: var(--accent-soft) !important; color: var(--accent) !important; }
.placing .box { cursor: copy; }
.box .btxt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.box.st-done .btxt { color: var(--muted); }
.box.st-skipped .btxt { text-decoration: line-through; color: var(--muted); }
.stbtn { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); background: var(--surface); display: grid; place-items: center; padding: 0; }
.stbtn svg { width: 14px; height: 14px; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.stbtn.done { background: var(--done-fill); border-color: var(--done); } .stbtn.done svg { stroke: var(--done-mark); }
.stbtn.partial { border-color: var(--partial); background: linear-gradient(90deg, var(--partial) 50%, var(--surface) 50%); }
.stbtn.skipped { border-color: var(--skipped); } .stbtn.skipped svg { stroke: var(--skipped); }
.tag { flex: none; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: var(--r); display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--tc); }
.tg-deep { --tc: var(--t-deep); } .tg-meet { --tc: var(--t-meet); } .tg-admin { --tc: var(--t-admin); } .tg-personal { --tc: var(--t-personal); }
.prio-flag { flex: none; font-family: var(--f-mono); font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 2; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--now); }
.readonly .box { cursor: default; }

/* Summary card */
.summary-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: -4px 0 -4px; }
.summary { padding: 16px; border-bottom: 1px solid var(--line); background: var(--paper); display: grid; gap: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--muted); }
.refl { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.refl div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
.refl p { margin: 2px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* Month */
.month { display: grid; gap: 18px; }
.goals ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px 18px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.goals li { display: flex; align-items: baseline; gap: 8px; }
.goals .prio-n { font-family: var(--f-display); font-size: 14px; color: var(--now); }
.goals input { flex: 1; min-width: 0; border: 0; border-bottom: 1px dashed var(--line); background: transparent; padding: 5px 2px; }
.goals input:focus { outline: none; border-bottom-color: var(--ink); }
/* Month: a notebook calendar. Ink frame, Mincho numerals, vermilion seal for today and finished days, dotted paper outside the month */
.cal { background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r); overflow: hidden; }
.cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-head div { padding: 9px 10px 8px; font-family: var(--f-display); font-size: 13px; letter-spacing: .06em; color: var(--ink); font-weight: 600; border-bottom: 1px solid var(--frame); }
.cal-head div:nth-child(n+6) { color: var(--muted); }
.dcell { min-height: 116px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 9px 9px; background: var(--surface); border-top: 0; border-left: 0; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; color: var(--ink); }
.dcell:nth-child(7n) { border-right: 0; }
.cal-grid .dcell:nth-last-child(-n+7) { border-bottom: 0; }
.dcell:hover { background: var(--paper); }
.dcell.out { background-color: var(--desk); background-image: var(--cell-out-image); background-size: 16px 16px; color: var(--muted); }
.dcell.out .dn { opacity: .6; }
.dcell .dn { display: flex; align-items: center; justify-content: space-between; min-height: 26px; margin-bottom: 2px; }
.dcell .dn > span:first-child { font-family: var(--f-display); font-size: 17px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.dcell.today .dn > span:first-child { color: var(--now); display: inline-grid; place-items: center; width: 28px; height: 28px; margin: -3px 0 -3px -5px; border: 1.5px solid var(--now); border-radius: 50%; font-size: 15px; }
.fin { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid var(--done); border-radius: 50%; color: var(--done); font-size: 10px; font-weight: 700; line-height: 1; }
.dp { font-size: 12px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
.dp::before { content: "・"; color: var(--accent); }
.dp.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--done); }
.dbar { margin-top: auto; display: flex; gap: 3px; height: 3px; padding-top: 6px; box-sizing: content-box; }
.dbar i { flex: 1; background: var(--line); }
.dbar i.f { background: var(--muted); opacity: .45; }
.dbar i.d { background: var(--done); opacity: 1; }
.dcount { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 640px) { .dcell { min-height: 66px; padding: 6px 5px; } .dp, .dcount { display: none; } .cal-head div { padding: 7px 4px; text-align: center; font-size: 12px; } .dcell .dn > span:first-child { font-size: 15px; } .dcell.today .dn > span:first-child { width: 24px; height: 24px; font-size: 13px; margin-left: -4px; } .fin { width: 14px; height: 14px; font-size: 8px; } }

/* Placing bar, toast, modal */
.placebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--ink); color: var(--paper); border-radius: var(--r); padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.placebar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.placebar button { border: 0; background: var(--paper); color: var(--ink); border-radius: var(--r); padding: 5px 10px; font-weight: 500; flex: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 9px 14px; box-shadow: var(--shadow); font-size: 14px; max-width: calc(100% - 32px); }
.overlay { position: fixed; inset: 0; z-index: 40; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface-solid); border: 1px solid var(--line); border-radius: var(--r); width: 100%; max-width: 560px; box-shadow: 0 20px 60px rgba(40,25,10,.3); }
.modal header { padding: 16px 18px 10px; }
.modal h3 { margin: 0; font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.modal .body { padding: 0 18px 8px; display: grid; gap: 18px; }
.modal footer { padding: 12px 18px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--line); }
.modal footer .left { margin-right: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 600; }
.field input[type=text], .field textarea { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 8px 10px; width: 100%; resize: vertical; }
.field input[type=text]:focus, .field textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 4px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--sunk); font-weight: 600; }
.chip.tag-chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--tc, var(--line)); }
.rev { display: grid; gap: 6px; }
.rev-row { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.rev-row:last-child { border-bottom: 0; }
.rev-row .t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.rev-row .x { overflow-wrap: anywhere; }
.rev-row .chips { grid-column: 2; }
.chip.s-done[aria-pressed="true"] { border-color: var(--done); color: var(--done); }
.chip.s-partial[aria-pressed="true"] { border-color: var(--partial); color: var(--partial); }
.chip.s-skipped[aria-pressed="true"] { border-color: var(--skipped); color: var(--skipped); }
.sect-title { font-family: var(--f-display); font-weight: 600; font-size: 15px; margin: 0 0 4px; }
.energy { display: flex; gap: 6px; }
.energy .chip { width: 38px; justify-content: center; font-family: var(--f-mono); }
.setup { max-width: 640px; margin: 0 auto; display: grid; gap: 4px; }
.setup p { margin: 0 0 8px; max-width: 65ch; }
.setup a, .banner a { color: var(--accent); }
.steps { margin: 4px 0 12px; padding-left: 20px; display: grid; gap: 10px; }
.steps ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; color: var(--muted); }
.setup code { font-family: var(--f-mono); font-size: 13px; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }
.setup-form { display: grid; gap: 12px; }
.field input[type=password] { border: 1px solid var(--line); background: var(--paper); border-radius: var(--r); padding: 8px 10px; width: 100%; font-family: var(--f-mono); }
.field input[type=password]:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.setup-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.google { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; font-weight: 600; background: var(--surface); border-color: var(--line); }
.btn.google:hover { border-color: var(--muted); }
/* Logged-out welcome screen: only the app's name, what it does, and the way in */
.signed-out .top, .signed-out #banner { display: none; }
.welcome { max-width: 500px; margin: clamp(24px, 9vh, 100px) auto 0; display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(22px, 5vw, 36px); box-shadow: var(--shadow); }
.welcome-brand { display: flex; align-items: center; gap: 12px; }

.brand-mark.big { width: 30px; height: 30px; border-width: 4px; border-radius: var(--r-s); }
.brand-mark.big::after { left: 3px; right: 3px; top: 8px; height: 4px; }
.welcome-lead { margin: 4px 0 0; font-family: var(--f-display); font-size: 22px; font-weight: 500; letter-spacing: -.01em; text-wrap: balance; }

.welcome-demo span { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.welcome-demo i { font-style: normal; font-weight: 500; font-size: 14px; padding: 8px 12px; border-radius: var(--r); background: var(--box-bg); border: 1px solid var(--box-border); }
.welcome-demo .flex i { background: transparent; border: 1.5px dashed var(--muted); }
.welcome-demo .done i { color: var(--muted); }
.welcome-demo .done i::before { content: "✓"; display: inline-grid; place-items: center; width: 16px; height: 16px; border: 1.5px solid var(--done); border-radius: 50%; color: var(--done); font-size: 10px; font-weight: 700; margin-right: 8px; vertical-align: -2px; }
.welcome-actions { display: grid; justify-items: start; gap: 6px; }
.welcome-actions .btn.google { padding: 11px 20px; font-size: 15.5px; }
.welcome-err { margin: 0; padding: 10px 12px; border-radius: var(--r); background: var(--sunk); }
.welcome-foot { margin: 6px 0 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font: inherit; }
.banner .btn { margin-left: 8px; padding: 3px 10px; }
.setup.routine { max-width: 860px; margin-bottom: 16px; }
.pane.setup + .pane.setup { margin-top: 16px; }
.setup.look { max-width: 760px; }
.style-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; margin-bottom: 10px; }
.style-card { position: relative; display: grid; gap: 6px; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-solid); color: var(--ink); }
.style-card:hover { border-color: var(--muted); }
.style-card[aria-pressed="true"] { border: 2px solid var(--ink); padding: 11px; }
.style-sw { display: flex; height: 26px; border-radius: var(--r-s); overflow: hidden; border: 1px solid var(--line); }
.style-sw i { flex: 1; }
.style-name { font-size: 20px; font-weight: 600; line-height: 1.15; }
.style-mood { font-size: 13px; color: var(--muted); }
.style-on { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--now); }
.rt-list { display: grid; gap: 8px; margin: 6px 0 10px; }
.rt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--paper); }
.rt-row select, .rt-row input[type=text] { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 8px; }
.rt-row input[type=text] { flex: 1 1 180px; min-width: 0; }
.rt-row input[type=text]:focus, .rt-row select:focus { outline: none; border-color: var(--accent); }
.rt-days { display: inline-flex; gap: 3px; }
.dchip { width: 26px; height: 26px; border-radius: var(--r-s); border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--muted); padding: 0; }
.dchip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.flexchk { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; }
.box.filled.flex { border: 1.5px dashed var(--muted); background: transparent; }
.box.filled.flex:hover { border-color: var(--ink); }
.flexmark { flex: none; font-size: 11px; font-family: var(--f-mono); color: var(--muted); }
.headbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.btnicon { display: inline-grid; place-items: center; margin-right: 6px; vertical-align: -3px; }
.btnicon svg, .calmark svg, .calnote svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.calmark { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.calnote { display: flex; gap: 8px; align-items: flex-start; margin: 0; }
.calnote svg { flex: none; margin-top: 2px; }
.cal-list { display: grid; gap: 2px; }
.chips-col { display: grid; gap: 8px; }
.cal-list .sect-title { margin: 0 0 2px; }
.cal-row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.cal-row:last-child { border-bottom: 0; }
.cal-kind { grid-row: span 2; font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 2px; }
.cal-title { font-weight: 500; overflow-wrap: anywhere; }
.cal-sub { font-size: 12.5px; color: var(--muted); }

function setSplit(h) {

function nearestFree(d, key) { // closest empty slot to `key` (ties go later), within the visible hours

function placeNowLine() {

function renderMonth() {
  const m = S.date.slice(0, 7), mo = getMonth(m), first = parseKey(m + "-01");
  const goals = mo.goals.map((g, i) => `<li><span class="prio-n">${i + 1}</span><input type="text" id="mg-${i}" data-input="goal" data-i="${i}" value="${esc(g)}" placeholder="${i === 0 ? "A goal for this month" : "Another goal"}" maxlength="140"></li>`).join("");
  const offset = (first.getDay() + 6) % 7; // Monday first
  const startD = new Date(first); startD.setDate(1 - offset);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  const cells = Math.ceil((offset + last.getDate()) / 7) * 7;
  let html = ""; const tk = todayKey();
  for (let i = 0; i < cells; i++) {
    const dd = new Date(startD); dd.setDate(startD.getDate() + i); const k = keyOf(dd);
    const d = hasDay(k) ? getDay(k) : null; const sm = d ? summarize(d) : null;
    const pr = d ? d.prio.filter(p => p.text.trim()) : [];
    let bar = "";
    if (sm && sm.planned) { const n = Math.min(Math.ceil(sm.plannedMin / 60), 12), dn = Math.round(sm.doneMin / 60); for (let j = 0; j < n; j++) bar += `<i class="${j < dn ? "d" : "f"}"></i>`; }
    html += `<button class="dcell ${k.slice(0, 7) !== m ? "out" : ""} ${k === tk ? "today" : ""}" id="dc-${k}" data-act="open-day" data-k="${k}" aria-label="${dd.toDateString()}">
      <span class="dn"><span>${dd.getDate()}</span>${d && d.finished ? `<span class="fin" title="Finished">✓</span>` : ""}</span>
      ${pr.slice(0, 3).map(p => `<span class="dp ${p.done ? "done" : ""}">${esc(p.text)}</span>`).join("")}

  return `<div class="month">
    <section class="pane goals"><div class="pane-head"><h2>Goals for ${first.toLocaleDateString([], { month: "long" })}</h2><span class="hint">Up to 5</span></div><ol>${goals}</ol></section>
    <div class="cal"><div class="cal-head">${wd}</div><div class="cal-grid">${html}</div></div>
    <p class="hint">Tap any day to open it. Past days show what you planned and how it went. Future days can be planned ahead.</p>
  </div>`;
}

// ---------- actions ----------
function srcText(src) {
  const d = getDay(S.date);
  if (src.from === "prio") return d.prio[src.i].text;
  if (src.from === "dump") return (d.dump.find(x => x.id === src.id) || {}).text;
  if (src.from === "park") return (getPark().items.find(x => x.id === src.id) || {}).text;
  if (src.from === "box") return (d.boxes[src.h] || {}).text;
}
function place(src, h, copy) { // copy: keep the original where it was (Option/Shift-drag, or Duplicate…)
  const k = S.date; const d0 = getDay(k); copy = !!(copy || src.copy);
  if (d0.finished) { toast("This day is finished. Reopen it to make changes."); return; }
  if (src.from === "box" && String(src.h) === String(h)) { S.placing = null; render(); return; }
  let parkItem = null; let bumped = null; let movedAside = null;
  if (src.from === "park") { parkItem = getPark().items.find(x => x.id === src.id); if (!parkItem) return; }
  mutateDay(k, d => {
    const existing = d.boxes[h];
    let box;
    if (src.from === "prio") box = { text: d.prio[src.i].text.trim(), pi: src.i, status: "planned" };
    else if (src.from === "dump") { const it = d.dump.find(x => x.id === src.id); if (!it) return; box = { text: it.text, status: "planned" }; if (!copy) d.dump = d.dump.filter(x => x.id !== src.id); }
    else if (src.from === "park") box = { text: parkItem.text, status: "planned" };
    else if (src.from === "box" && copy) { if (!d.boxes[src.h]) return; box = Object.assign(clone(d.boxes[src.h]), { status: "planned" }); }
    else if (src.from === "box") { box = d.boxes[src.h]; delete d.boxes[src.h]; if (existing) d.boxes[src.h] = existing; }
    if (existing && (src.from !== "box" || copy)) {
      const fk = existing.flex ? nearestFree(d, h) : null;
      if (fk) { d.boxes[fk] = existing; movedAside = [existing.text, fk]; }
      else { bumped = existing.text; if (existing.pi == null) d.dump.push({ id: rid(), text: existing.text }); }
    }
    d.boxes[h] = box;
  }, { silent: true });
  if (parkItem && !copy) mutatePark(p => { p.items = p.items.filter(x => x.id !== src.id); }, { silent: true });
  S.placing = null; render();
  const extra = movedAside ? ` “${movedAside[0]}” moved to ${timeLabel(minOfKey(movedAside[1]))}.` : bumped ? ` “${bumped}” went back to the brain dump.` : "";
  if (copy) toast(`Copied to ${timeLabel(minOfKey(h))}.${extra}`);
  else if (src.from === "box" && getDay(k).boxes[src.h]) toast("Swapped the two boxes.");
  else if (movedAside) toast(`“${movedAside[0]}” moved to ${timeLabel(minOfKey(movedAside[1]))}.`);
  else if (bumped) toast(`“${bumped}” went back to the brain dump.`);
}
function cycleStatus(h) {
  const order = ["planned", "done", "partial", "skipped"];
  mutateDay(S.date, d => { const b = d.boxes[h]; b.status = order[(order.indexOf(b.status || "planned") + 1) % order.length]; });
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act, k = S.date;

  switch (act) {
    case "view": S.view = t.dataset.v; S.placing = null; if (S.mode !== "setup") S.showSetup = false; render(); break;
    case "nav": S.placing = null;
      if (S.view === "day") S.date = addDays(S.date, +t.dataset.d);
      else { const d = parseKey(S.date); d.setDate(1); d.setMonth(d.getMonth() + +t.dataset.d); S.date = keyOf(d); }
      render(); break;
    case "today": S.date = todayKey(); S.placing = null; render(); break;
    case "open-day": S.date = t.dataset.k; S.view = "day"; render(); window.scrollTo(0, 0); break;
    case "prio-done": mutateDay(k, d => { d.prio[+t.dataset.i].done = t.checked; }); break;
    case "pick": {
      const src = t.dataset.from === "prio" ? { from: "prio", i: +t.dataset.i } : { from: t.dataset.from, id: t.dataset.id };
      const same = S.placing && S.placing.from === src.from && (S.placing.i === src.i && S.placing.id === src.id);
      S.placing = same ? null : Object.assign(src, { text: srcText(src) });

    case "split": if (ro) { toast("This day is finished. Reopen it to make changes."); break; } setSplit(+t.dataset.h); break;
    case "box": {

      else mutatePark(p => { p.items = p.items.filter(x => x.id !== t.dataset.id); });
      if (S.placing && S.placing.id === t.dataset.id) S.placing = null; break; }
    case "to-park": {

      mutatePark(p => { p.items = p.items.filter(x => x.id !== it.id); }, { silent: true });
      mutateDay(k, d => { d.dump.push({ id: rid(), text: it.text }); }); toast("Added to this day’s brain dump."); break; }
    case "ext": {

      mutateDay(k, d => {

      break; }
    case "rt-add": mutate("routine", getRoutine(), r => { const last = r.items.reduce((m, it) => Math.max(m, it.start + it.len), 360); r.items.push({ id: "r-" + rid(), start: Math.min(last, 1425), len: 60, text: "", tag: "", flex: false, days: [0, 1, 2, 3, 4, 5, 6] }); }); break;
    case "rt-del": mutate("routine", getRoutine(), r => { r.items = r.items.filter(it => it.id !== t.dataset.id); }); break;
    case "rt-day": mutate("routine", getRoutine(), r => { const it = r.items.find(x => x.id === t.dataset.id); const d0 = +t.dataset.d; const days = new Set(it.days || [0,1,2,3,4,5,6]); days.has(d0) ? days.delete(d0) : days.add(d0); it.days = [...days].sort(); }); break;

    case "style": setStyle(t.dataset.v); render(); break;
    case "settings": e.preventDefault(); S.setupView = "settings"; S.showSetup = true; S.placing = null; render(); window.scrollTo(0, 0); break;
    case "setup-back": S.showSetup = false; render(); break;
    case "use-local": lsSet(CFG_KEY, Object.assign({}, lsGet(CFG_KEY), { mode: "local" })); Store.startLocal(); break;
    case "to-login": { const c = lsGet(CFG_KEY) || {}; delete c.mode; lsSet(CFG_KEY, Object.keys(c).length ? c : null); location.reload(); break; }
    case "google": googleSignIn(); break;
    case "logout": logout(); break;

function openBoxEditor(h) {
  const k = S.date, d = getDay(k), b = d.boxes[h] ? clone(d.boxes[h]) : { text: "", tag: "", status: "planned" };
  const isNew = !d.boxes[h], len = lenOfKey(d, h), nk = nextSlot(d, h);
  const tagChips = () => TAGS.map(([v, n]) => `<button class="chip tag-chip ${v ? "tg-" + v : ""}" data-m="tag" data-v="${v}" aria-pressed="${(b.tag || "") === v}">${n}</button>`).join("");
  const stChips = () => [["planned", "Planned"], ["done", "Done"], ["partial", "Partly done"], ["skipped", "Skipped"]].map(([v, n]) => `<button class="chip s-${v}" data-m="st" data-v="${v}" aria-pressed="${(b.status || "planned") === v}">${n}</button>`).join("");
  const ov = openModal(`

    <div class="body">

      ${b.cal ? `<p class="hint calnote">${ICON.cal}<span>From Google Calendar${b.cal.time ? ` (${esc(b.cal.time)})` : ""}. Syncing the calendar again updates this box.${b.cal.link ? ` <a href="${esc(b.cal.link)}" target="_blank" rel="noopener">Open in Google Calendar</a>` : ""}</span></p>` : ""}
      <label class="flexchk" for="be-flex"><input type="checkbox" class="check" id="be-flex" ${b.flex ? "checked" : ""}> Flexible: if I drop something here, move this to the nearest free time</label>
      ${isNew ? "" : `<div class="field"><span class="lbl">Status</span><div class="chips" id="be-st">${stChips()}</div></div>`}
    </div>
    <footer>
      ${isNew ? "" : `<div class="left">
        <button class="btn ghost" data-m="next" id="be-next" ${!nk || d.boxes[nk] ? "disabled" : ""} title="${nk && d.boxes[nk] ? "The next box is already booked" : ""}">${nk ? `Continue into ${timeLabel(minOfKey(nk))}` : "Continue into next box"}</button>
        <button class="btn ghost" data-m="move" id="be-move">Move…</button>

      if (m === "cancel") closeModal();

      }

function openFinish(editOnly) { // editOnly: change the reflection of a finished day without touching leftovers
  const k = S.date, d = getDay(k), tomorrow = addDays(k, 1);
  const st = {}; Object.entries(d.boxes).forEach(([h, b]) => st[h] = b.status || "planned");
  const dest = {}; const refl = Object.assign({ well: "", blocked: "", change: "", energy: 0 }, d.reflection || {});
  const hrs = sortedKeys(d);
  const leftovers = () => {
    const L = [];

        <label class="flexchk" for="cal-routine"><input type="checkbox" class="check" id="cal-routine" ${opts.routine ? "checked" : ""} ${opts.own ? "" : "disabled"}> Include routine boxes (Get ready, Walk…)</label>
      </div>
      <div class="cal-list" id="cal-list">${listHTML()}</div>
      <label class="flexchk" for="cal-dump" id="cal-dump-wrap" ${skippedN() ? "" : "hidden"}><input type="checkbox" class="check" id="cal-dump" checked> Put events that don’t fit in the brain dump</label>
      <p class="hint">${CAL_WRITE ? "Only this day changes. Boxes you planned yourself are never overwritten, and meetings you didn’t create are never deleted." : "Hourbox only reads your calendar and never changes it. Only this day’s boxes change, and boxes you planned yourself are never overwritten."}</p>
    </div>
    <footer><button class="btn" data-m="cancel" id="cal-cancel">Cancel</button><button class="btn primary" data-m="apply" id="cal-apply" ${anyChange() ? "" : "disabled"}>${anyChange() ? (CAL_WRITE ? "Sync" : "Add to this day") : "Nothing to change"}</button></footer>`,
    async btn => {
      if (btn.dataset.m === "cancel") { closeModal(); return; }
      if (btn.dataset.m !== "apply") return;
      btn.disabled = true; btn.textContent = "Syncing…";
      const o = { own: $("#cal-own").checked, routine: $("#cal-routine").checked }, toDumpOn = $("#cal-dump") && $("#cal-dump").checked;
      let res;
      try { res = await buildSync(getDay(k), k, await Cal.fetchDay(k, token), o, calApi(token)); }
      catch (e) { closeModal(); calError(e); return; }
      const toDump = toDumpOn ? res.rows.filter(r => r.kind === "overlap").map(r => r.title) : [];
      let dumped = 0;
      mutateDay(k, d => { Object.keys(d).forEach(x => delete d[x]); Object.assign(d, clone(res.next)); toDump.forEach(text => { if (!d.dump.some(x => x.text === text)) { d.dump.push({ id: rid(), text }); dumped++; } }); }, { silent: true });
      closeModal();
      const n = kind => res.push.filter(p => p.kind === kind).length, m = kind => res.rows.filter(r => r.kind === kind).length;
      const parts = [n("add") && `${n("add")} added to Google`, (n("move") + n("rename")) && `${n("move") + n("rename")} changed in Google`, n("delete") && `${n("delete")} deleted from Google`,
        m("new") && `${m("new")} new from Google`, m("updated") && `${m("updated")} updated`, m("removed") && `${m("removed")} removed`, dumped && `${dumped} sent to the brain dump`].filter(Boolean);
      toast((parts.length ? `Calendar synced: ${parts.join(", ")}.` : "Calendar synced.") + (res.failed.length ? ` Couldn’t sync “${res.failed[0]}”${res.failed.length > 1 ? ` and ${res.failed.length - 1} more` : ""}.` : ""));
    });
  ov.addEventListener("change", async e => {
    if (e.target.id !== "cal-own" && e.target.id !== "cal-routine") return;
    const o = { own: $("#cal-own").checked, routine: $("#cal-routine").checked };
    $("#cal-routine").disabled = !o.own;
    try { localStorage.setItem("hourbox-cal-push", JSON.stringify(o)); } catch (err) {}
    sim = await buildSync(getDay(k), k, events, o, simApi);
    $("#cal-list").innerHTML = listHTML(); $("#cal-dump-wrap").hidden = !skippedN(); $("#cal-apply").disabled = !anyChange();
  });
}

// ---------- box notifications ----------
// While Hourbox is open, tell me when a box ends and the next one starts. Per device.
const NOTIFY_KEY = "hourbox-notify";
const Notify = {
  supported: "Notification" in window,
  get on() { try { return this.supported && Notification.permission === "granted" && localStorage.getItem(NOTIFY_KEY) === "on"; } catch (e) { return false; } },
  reg: null, lastMin: null,
  async ensureWorker() {
    if (this.reg || !("serviceWorker" in navigator)) return this.reg;
    try { this.reg = await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready; } catch (e) { this.reg = null; }
    return this.reg;
  },
  async enable() {
    if (!this.supported) return;
    let perm = Notification.permission;
    if (perm === "default") { try { perm = await Notification.requestPermission(); } catch (e) {} }
    if (perm === "granted") { try { localStorage.setItem(NOTIFY_KEY, "on"); } catch (e) {} await this.ensureWorker(); this.lastMin = null; toast("Notifications are on for this device."); }
    else toast("Notifications weren’t allowed. You can allow them in this browser’s site settings.");
    if (S.showSetup) render();
  },
  disable() { try { localStorage.removeItem(NOTIFY_KEY); } catch (e) {} toast("Notifications are off for this device."); if (S.showSetup) render(); },
  async show(title, body, opts = {}) {
    const o = Object.assign({ body, icon: "icon-180.png", badge: "icon-180.png", tag: opts.tag, renotify: true, data: opts.data || {} }, opts.actions ? { actions: opts.actions } : {});
    const reg = await this.ensureWorker();
    try { if (reg) return await reg.showNotification(title, o); } catch (e) {}
    try { delete o.actions; new Notification(title, o); } catch (e) {} // desktop fallback
  },
  // What changes at minute m today: the box that ends there and the one that starts there.
  event(d, m) {
    let prev = null, next = null;
    for (const [k, b] of Object.entries(d.boxes)) {
      const s0 = minOfKey(k), e0 = s0 + lenOfKey(d, k);
      if (e0 === m) prev = [k, b];
      if (s0 === m) next = [k, b];
    }
    if (prev && next && prev[1].text === next[1].text) return null; // same activity continues
    return prev || next ? { prev, next } : null;
  },
  nextBoxAfter(d, m) { const ks = sortedKeys(d).filter(k => minOfKey(k) >= m); return ks.length ? ks[0] : null; },
  tick() {
    if (!this.on || !S.ready || S.mode === "setup") { this.lastMin = null; return; }
    const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes(), k = todayKey();
    if (this.lastMin == null || this.lastMin > nowMin) { this.lastMin = nowMin; return; } // start fresh: never announce the past
    const from = this.lastMin; this.lastMin = nowMin;
    const d = getDay(k); if (d.finished) return;
    for (let m = from + 1; m <= nowMin; m++) {
      if (nowMin - m > 3) continue; // came back after a long sleep: skip stale changes
      const ev = this.event(d, m); if (!ev) continue;
      const { prev, next } = ev;
      let title, body;
      if (next) { title = `Now: ${next[1].text}`; body = slotRange(d, next[0]) + (prev ? ` · “${prev[1].text}” has ended` : ""); }
      else { const nk = this.nextBoxAfter(d, m); title = `“${prev[1].text}” has ended`; body = nk ? `Nothing boxed until ${timeLabel(minOfKey(nk))}.` : "Nothing else is boxed today."; }
      const canMark = prev && (prev[1].status || "planned") === "planned";
      if (document.visibilityState === "visible" && document.hasFocus()) { toast(`${title}. ${body}`); continue; }
      this.show(title, body, { tag: `hourbox-${k}-${m}`, data: canMark ? { date: k, key: prev[0] } : {},
        actions: canMark ? [{ action: "done", title: "Mark done" }] : undefined });
    }
  }
};
setInterval(() => Notify.tick(), 15000);
document.addEventListener("visibilitychange", () => Notify.tick());
if (Notify.on) Notify.ensureWorker();
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", ev => {
  const m = ev.data || {}; if (m.type !== "hourbox-mark-done") return;
  const d = getDay(m.date); if (!d.boxes[m.key]) return;
  mutateDay(m.date, dd => { if (dd.boxes[m.key]) dd.boxes[m.key].status = "done"; });
  toast(`Marked “${d.boxes[m.key].text}” done.`);
});
function renderNotify() {
  let body;
  if (!Notify.supported) body = `<p class="hint">This browser can’t show notifications.</p>`;
  else if (Notification.permission === "denied") body = `<p>Notifications are blocked for Hourbox in this browser. Allow them in the browser’s site settings for ${esc(location.host)}, then come back here.</p>`;
  else if (Notify.on) body = `<p>On for this device. You’ll get a notification when a box ends and the next one starts.</p>
    <div class="setup-actions"><button class="btn" type="button" data-act="notify-test" id="nt-test">Send a test</button><button class="btn ghost" type="button" data-act="notify-off" id="nt-off">Turn off</button></div>`;
  else body = `<p>Get a notification when a box ends and the next one starts. It works while Hourbox is open on this device, even in the background.</p>
    <div class="setup-actions"><button class="btn primary" type="button" data-act="notify-on" id="nt-on">Turn on notifications</button></div>`;
  return `<section class="pane setup"><div class="pane-head"><h2>Notifications</h2></div>${body}</section>`;
}

// ---------- clock ----------
let lastDay = todayKey();
setInterval(() => {
  if (modalOpen()) return;
  const tk = todayKey();
  if (tk !== lastDay) { if (S.date === lastDay) S.date = tk; lastDay = tk; render(); return; }
  if (S.view === "day" && S.date === tk && S.ready) {
    const a = document.activeElement; if (a && a.matches("input,textarea")) { document.querySelector(".nowline")?.remove(); placeNowLine(); return; }
    render();
  }
}, 60000);

setAppearance(getAppearance());
syncThemeColor();
renderHeader();
Store.init();
})();
</script>
</body>
